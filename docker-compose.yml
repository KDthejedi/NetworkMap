services:
  postgres:
    image: postgres:16-alpine
    container_name: networkmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: networkmap
      POSTGRES_PASSWORD: networkmap
      POSTGRES_DB: networkmap
    ports:
      - "5432:5432"
    volumes:
      - networkmap_pg:/var/lib/postgresql/data
      - ./lib/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkmap -d networkmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  networkmap_pg:
